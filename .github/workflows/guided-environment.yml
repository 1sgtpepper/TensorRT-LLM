name: Prepare guided decoding validation dependencies

on:
  push:
    branches:
      - validation/guided-decoding-correctness
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      UV_CONCURRENT_DOWNLOADS: "4"
      UV_HTTP_RETRIES: "2"
      UV_HTTP_TIMEOUT: "60"
      TRTLLM_NO_USAGE_STATS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the declared dependency without a published wheel
        run: |
          python -m pip install uv==0.11.28
          python -m pip wheel --no-deps -w wheelhouse 'https://files.pythonhosted.org/packages/source/l/llist/llist-0.7.1.tar.gz#sha256=6f73a120136897a0bce61c202188f4f3891d9f70aa906d21fc1ee1cf43659eca'
      - name: Resolve the published environment using binary packages
        run: |
          uv pip compile .github/guided-environment.in --only-binary :all: --find-links wheelhouse \
            --index https://pypi.nvidia.com --index https://download.pytorch.org/whl/cu130 \
            --index-strategy unsafe-best-match --output-file environment.txt
      - name: Restore the exact published wheel
        id: published-cache
        uses: actions/cache/restore@v4
        with:
          path: published-wheel
          key: published-native-c70a5ed5f5ad120bd419f496942cbece42a80bf9fa1ea5b3690d32eeae180711
      - name: Download and verify the published native build
        run: |
          mkdir -p published-wheel evidence
          wheel=published-wheel/tensorrt_llm-1.3.0rc26.dev202609050001-cp312-cp312-manylinux_2_28_x86_64.whl
          if ! test -f "$wheel"; then
            curl --fail --location --connect-timeout 15 --max-time 600 --retry 2 --retry-max-time 120 \
              https://pypi.nvidia.com/trtllm_nightly/tensorrt-llm/tensorrt_llm-1.3.0rc26.dev202609050001-cp312-cp312-manylinux_2_28_x86_64.whl \
              --output "$wheel"
          fi
          echo "c70a5ed5f5ad120bd419f496942cbece42a80bf9fa1ea5b3690d32eeae180711  $wheel" | sha256sum -c -
          sha256sum "$wheel" > evidence/published-wheel.sha256
      - name: Preserve the verified wheel before environment checks
        if: steps.published-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: published-wheel
          key: ${{ steps.published-cache.outputs.cache-primary-key }}
      - name: Install the published binary environment
        run: |
          set -o pipefail
          df -h . "$RUNNER_TEMP"
          test "$(df --output=avail -B1 "$RUNNER_TEMP" | tail -1)" -gt 25000000000
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libnuma1 openmpi-bin libopenmpi-dev
          uv venv --python 3.12 "$RUNNER_TEMP/published-env"
          uv pip install --python "$RUNNER_TEMP/published-env/bin/python" --only-binary :all: \
            --find-links wheelhouse --default-index https://pypi.org/simple \
            --index https://download.pytorch.org/whl/cu130 --index-strategy unsafe-best-match \
            --link-mode hardlink -r environment.txt 2>&1 | tee evidence/install.log
          uv pip install --python "$RUNNER_TEMP/published-env/bin/python" --no-deps \
            --link-mode hardlink published-wheel/*.whl 2>&1 | tee evidence/native-install.log
          uv pip check --python "$RUNNER_TEMP/published-env/bin/python" 2>&1 | tee evidence/dependency-check.log
          uv pip freeze --python "$RUNNER_TEMP/published-env/bin/python" > evidence/runtime-packages.txt
      - name: Supply the genuine driver libraries for CPU import
        run: |
          mkdir -p "$RUNNER_TEMP/driver-package"
          cd "$RUNNER_TEMP/driver-package"
          apt-get download libnvidia-compute-580
          sha256sum ./*.deb > "$GITHUB_WORKSPACE/evidence/driver-package.sha256"
          dpkg-deb --field ./*.deb Package Version > "$GITHUB_WORKSPACE/evidence/driver-package.txt"
          dpkg-deb --extract ./*.deb "$RUNNER_TEMP/driver-libraries"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/driver-libraries/usr/lib/x86_64-linux-gnu:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
      - name: Run the existing import contract against the installed package
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/published-probes"
          cp tests/unittest/others/test_import_gpu_free.py "$RUNNER_TEMP/published-probes/"
          cd "$RUNNER_TEMP/published-probes"
          CUDA_VISIBLE_DEVICES='' "$RUNNER_TEMP/published-env/bin/python" -m pytest -s --tb=short -q \
            test_import_gpu_free.py 2>&1 | tee "$GITHUB_WORKSPACE/evidence/import.log"
          CUDA_VISIBLE_DEVICES='' "$RUNNER_TEMP/published-env/bin/python" -c \
            'import tensorrt_llm; import tensorrt_llm._torch.pyexecutor.guided_decoder; import tensorrt_llm._torch.pyexecutor.llm_request; import tensorrt_llm.bindings; print(tensorrt_llm.__file__); print(tensorrt_llm.bindings.__file__)' \
            2>&1 | tee "$GITHUB_WORKSPACE/evidence/native-modules.log"
      - name: Preserve dependency evidence in the job log
        if: always()
        run: |
          mkdir -p evidence wheelhouse
          git rev-parse HEAD > evidence/revision.txt
          python -m pip freeze > evidence/build-packages.txt
          cp .github/guided-environment.in evidence/
          if test -f environment.txt; then
            cp environment.txt evidence/
          fi
          find wheelhouse evidence -type f -exec sha256sum {} + > checksums.txt
          tar -czf dependency-evidence.tar.gz wheelhouse evidence checksums.txt
          sha256sum dependency-evidence.tar.gz
          echo 'BEGIN_DEPENDENCY_EVIDENCE_BASE64'
          base64 -w 76 dependency-evidence.tar.gz
          echo 'END_DEPENDENCY_EVIDENCE_BASE64'
