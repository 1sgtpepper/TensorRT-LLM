name: Validate guided worker recomputation

on:
  push:
    branches: [validation/guided-decoding-correctness]
    paths:
      - .github/workflows/guided-worker.yml
      - .github/guided_worker.py

permissions:
  contents: read

jobs:
  worker:
    runs-on: [self-hosted, linux, x64, guided-validation]
    timeout-minutes: 8
    env:
      TRTLLM_NO_USAGE_STATS: "1"
      TLLM_WORKER_USE_SINGLE_PROCESS: "1"
      CUDA_MODULE_LOADING: LAZY
      MAX_JOBS: "1"
      OMP_NUM_THREADS: "1"
      CC: /usr/bin/gcc-15
      CXX: /usr/bin/g++-15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Verify the installed published source and runtime
        run: |
          set -o pipefail
          mkdir -p evidence
          python - <<'PY' | tee evidence/source-provenance.log
          import hashlib
          import importlib.metadata
          import os
          from pathlib import Path
          import subprocess
          import sys
          import sysconfig

          distribution = importlib.metadata.distribution("tensorrt-llm")
          assert distribution.version == "1.3.0rc26.dev202609050001"
          package = Path(distribution.locate_file("tensorrt_llm")).resolve()
          assert not package.is_relative_to(Path.cwd())
          print("Python:", sys.executable)
          print("Published package:", package)
          for relative in (
              "_torch/pyexecutor/guided_decoder.py",
              "_torch/pyexecutor/grammar_matcher.py",
              "_torch/pyexecutor/llm_request.py",
              "_torch/pyexecutor/seq_slot_manager.py",
              "_torch/pyexecutor/scheduler/__init__.py",
              "_torch/pyexecutor/scheduler/scheduler.py",
              "_torch/speculative/dynamic_tree_ops.py",
          ):
              actual = (package / relative).read_bytes()
              assert actual == (Path("tensorrt_llm") / relative).read_bytes(), relative
              print(hashlib.sha256(actual).hexdigest(), relative)
          native = list(package.glob("bindings.*.so"))
          assert len(native) == 1
          print(hashlib.sha256(native[0].read_bytes()).hexdigest(), native[0])
          compiler = importlib.metadata.distribution("nvidia-cuda-nvcc")
          nvcc = [Path(compiler.locate_file(path)).resolve()
                  for path in compiler.files if path.name == "nvcc"]
          assert len(nvcc) == 1
          subprocess.run([str(nvcc[0]), "--version"], check=True)
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write(f"CUDA_HOME={nvcc[0].parent.parent}\n")
              output.write(f"LD_LIBRARY_PATH={Path(sys.prefix) / 'lib'}:"
                           f"{sysconfig.get_config_var('LIBDIR')}:"
                           f"{os.environ.get('LD_LIBRARY_PATH', '')}\n")
          PY
          uv pip check --python "$(command -v python)" 2>&1 | tee evidence/dependency-check.log
          uv pip freeze --python "$(command -v python)" > evidence/runtime-packages.txt
          nvidia-smi --query-gpu=name,compute_cap,driver_version,memory.total,memory.free --format=csv > evidence/device.txt
          "$CXX" --version > evidence/host-compiler.txt
      - name: Exercise real worker with ample and constrained KV capacity
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/guided-worker"
          cp .github/guided_worker.py "$RUNNER_TEMP/guided-worker/"
          cd "$RUNNER_TEMP/guided-worker"
          timeout --signal=TERM --kill-after=10s 180s \
            python guided_worker.py --kv-tokens 512 --output "$GITHUB_WORKSPACE/evidence/worker-ample.json" \
            2>&1 | tee "$GITHUB_WORKSPACE/evidence/worker-ample.log"
          timeout --signal=TERM --kill-after=10s 180s \
            python guided_worker.py --kv-tokens 128 --output "$GITHUB_WORKSPACE/evidence/worker-pressure.json" \
            2>&1 | tee "$GITHUB_WORKSPACE/evidence/worker-pressure.log"
      - name: Preserve available worker evidence
        if: always()
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/revision.txt
          cp .github/guided_worker.py evidence/
          find evidence -type f -exec sha256sum {} + > checksums.txt
          tar -czf worker-evidence.tar.gz evidence checksums.txt
          sha256sum worker-evidence.tar.gz
          echo 'BEGIN_WORKER_EVIDENCE_BASE64'
          base64 -w 76 worker-evidence.tar.gz
          echo 'END_WORKER_EVIDENCE_BASE64'
