name: Check guided tree fix

on:
  push:
    branches: [ci/guided-tree-fix]
    paths: [.github/workflows/fix-candidates.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d7fdab967afed08a86b3816c89cec39c2ee65ab4
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: guided-recompute-hooks-py312-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Run repository release checks on changed files
        run: |
          test "$(git rev-parse HEAD)" = d7fdab967afed08a86b3816c89cec39c2ee65ab4
          git fetch --depth=1 origin 17803f6c0cbe8d9fed3ccf46a295b867e3493d3e
          git diff --name-only 17803f6c0cbe8d9fed3ccf46a295b867e3493d3e HEAD > /tmp/changed-files.txt
          python -u scripts/release_check.py --files-from /tmp/changed-files.txt
          git diff --exit-code
      - name: Verify the GPU regression is selected by CI
        run: |
          python scripts/test_to_stage_mapping.py --tests unittest/_torch/test_guided_tree.py > /tmp/tree-stages.txt
          cat /tmp/tree-stages.txt
          test -s /tmp/tree-stages.txt
          grep -q A10-PyTorch /tmp/tree-stages.txt
      - name: Show hook changes
        if: failure()
        run: git diff
