name: Check guided recomputation fix

on:
  push:
    branches: [ci/guided-recompute-fix]
    paths: [.github/workflows/fix-candidates.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d3daed28efb8418f6b9f5b0f83c158e5a5909236
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: guided-recompute-hooks-py312-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Run repository release checks on changed files
        run: |
          test "$(git rev-parse HEAD)" = d3daed28efb8418f6b9f5b0f83c158e5a5909236
          git diff --name-only HEAD^ HEAD > /tmp/changed-files.txt
          python -u scripts/release_check.py --files-from /tmp/changed-files.txt
          git diff --exit-code
      - name: Verify the GPU regression is selected by CI
        run: python scripts/test_to_stage_mapping.py --tests unittest/_torch/test_guided_recompute.py
      - name: Show hook changes
        if: failure()
        run: git diff
