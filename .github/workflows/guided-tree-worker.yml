name: Validate guided dynamic-tree worker

on:
  push:
    branches: [validation/guided-decoding-correctness]
    paths:
      - .github/workflows/guided-tree-worker.yml
      - .github/guided_tree_worker.py

permissions:
  contents: read

jobs:
  worker:
    runs-on: [self-hosted, linux, x64, guided-validation]
    timeout-minutes: 8
    env:
      TRTLLM_NO_USAGE_STATS: "1"
      TLLM_WORKER_USE_SINGLE_PROCESS: "1"
      CUDA_MODULE_LOADING: LAZY
      MAX_JOBS: "1"
      OMP_NUM_THREADS: "1"
      CC: /usr/bin/gcc-15
      CXX: /usr/bin/g++-15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Verify the installed published source and runtime
        run: |
          set -o pipefail
          mkdir -p evidence
          python - <<'PY' | tee evidence/source-provenance.log
          import hashlib
          import importlib.metadata
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          import sysconfig

          distribution = importlib.metadata.distribution("tensorrt-llm")
          assert distribution.version == "1.3.0rc26.dev202609050001"
          package = Path(distribution.locate_file("tensorrt_llm")).resolve()
          assert not package.is_relative_to(Path.cwd())
          print("Python:", sys.executable)
          print("Published package:", package)
          for relative in (
              "_torch/pyexecutor/guided_decoder.py",
              "_torch/pyexecutor/grammar_matcher.py",
              "_torch/pyexecutor/llm_request.py",
              "_torch/pyexecutor/seq_slot_manager.py",
              "_torch/pyexecutor/scheduler/__init__.py",
              "_torch/pyexecutor/scheduler/scheduler.py",
              "_torch/speculative/dynamic_tree_ops.py",
              "_torch/speculative/eagle3.py",
              "_torch/speculative/eagle3_dynamic_tree.py",
              "_torch/models/modeling_speculative.py",
          ):
              actual = (package / relative).read_bytes()
              assert actual == (Path("tensorrt_llm") / relative).read_bytes(), relative
              print(hashlib.sha256(actual).hexdigest(), relative)
          native = list(package.glob("bindings.*.so"))
          assert len(native) == 1
          print(hashlib.sha256(native[0].read_bytes()).hexdigest(), native[0])
          compiler = json.loads(subprocess.check_output([
              os.environ["VALIDATION_CUDA_PYTHON"], "-c",
              "import importlib.metadata as m,json; from pathlib import Path; "
              "d=m.distribution('nvidia-cuda-nvcc'); "
              "print(json.dumps({'nvcc':[str(Path(d.locate_file(f)).resolve()) for f in d.files if f.name=='nvcc'],"
              "'versions':{n:m.version(n) for n in ('nvidia-cuda-nvcc','nvidia-nvvm','nvidia-cuda-runtime','nvidia-cuda-cccl','nvidia-cuda-crt')}}))"
          ], text=True))
          assert compiler["versions"] == {
              "nvidia-cuda-nvcc": "13.0.88", "nvidia-nvvm": "13.0.88",
              "nvidia-cuda-runtime": "13.0.96", "nvidia-cuda-cccl": "13.0.85",
              "nvidia-cuda-crt": "13.0.88",
          }
          assert len(compiler["nvcc"]) == 1
          nvcc = Path(compiler["nvcc"][0])
          assert (nvcc.parent.parent / "lib64/libcudart.so").is_file()
          print("Dedicated CUDA toolchain:", compiler)
          subprocess.run([str(nvcc), "--version"], check=True)
          subprocess.run([str(nvcc.parent / "ptxas"), "--version"], check=True)
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write(f"CUDA_HOME={nvcc.parent.parent}\n")
              output.write(f"LD_LIBRARY_PATH={Path(sys.prefix) / 'lib'}:"
                           f"{sysconfig.get_config_var('LIBDIR')}:"
                           f"{os.environ.get('LD_LIBRARY_PATH', '')}\n")
          PY
          uv pip check --python "$(command -v python)" 2>&1 | tee evidence/dependency-check.log
          uv pip freeze --python "$(command -v python)" > evidence/runtime-packages.txt
          nvidia-smi --query-gpu=name,compute_cap,driver_version,memory.total,memory.free --format=csv > evidence/device.txt
          "$CXX" --version > evidence/host-compiler.txt
      - name: Check the linear worker control
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=10s 180s \
            python .github/guided_tree_worker.py --mode linear --output evidence/linear.json 2>&1 | tee evidence/linear.log
      - name: Check real generated-tree output
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=10s 180s \
            python .github/guided_tree_worker.py --mode tree --output evidence/tree.json 2>&1 | tee evidence/tree.log
      - name: Preserve available worker evidence
        if: always()
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/revision.txt
          cp .github/guided_tree_worker.py evidence/
          find evidence -type f -exec sha256sum {} + > checksums.txt
          tar -czf tree-worker-evidence.tar.gz evidence checksums.txt
          sha256sum tree-worker-evidence.tar.gz
          echo 'BEGIN_TREE_WORKER_EVIDENCE_BASE64'
          base64 -w 76 tree-worker-evidence.tar.gz
          echo 'END_TREE_WORKER_EVIDENCE_BASE64'
